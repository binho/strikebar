<!doctype html>
<!-- Mac App Store screenshot frame, rendered at 2560×1600 by marketing/capture.sh.
     Query parameters: img (window capture), title, sub. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 2560px; height: 1600px; overflow: hidden; }
  body {
    font-family: system-ui;
    background:
      radial-gradient(70% 60% at 50% 0%, #ffffff 0%, rgba(255,255,255,0) 70%),
      linear-gradient(180deg, #eef0f4 0%, #dfe3ea 100%);
    color: #12161d;
    -webkit-font-smoothing: antialiased;
  }
  .text { position: absolute; top: 96px; left: 0; right: 0; text-align: center; }
  h1 { margin: 0; font-size: 104px; line-height: 1.05; font-weight: 700; letter-spacing: -0.025em; }
  p { margin: 30px auto 0; font-size: 44px; line-height: 1.3; color: #596273; font-weight: 450;
      max-width: 1900px; }
  .shot {
    position: absolute; left: 50%; top: 392px; width: 1920px; transform: translateX(-50%);
    border-radius: 22px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(0,0,0,.10), 0 30px 60px rgba(20,28,45,.28), 0 8px 18px rgba(20,28,45,.14);
  }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="text"><h1 id="title"></h1><p id="sub"></p></div>
  <div class="shot"><img id="img" alt=""></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("title").textContent = q.get("title") || "";
  document.getElementById("sub").textContent = q.get("sub") || "";
  document.getElementById("img").src = q.get("img") || "";
</script>
</body>
</html>

[package]
name = "strikebar"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.35.0", features = ["persistence"] }
image = "0.25.10"
libheif-rs = { version = "3.0.0", features = ["image"] }
lucide-icons = "1.73.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }

[dev-dependencies]
ron = "0.12"
